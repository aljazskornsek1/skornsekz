<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zavarovanje Skornšek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;      /* zapolni zaslon z minimalnim potrebnim obrezom, brez zooma */
      object-position: center;
      z-index: -2;
      will-change: opacity;
      filter: brightness(1.02);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10,8,4,0.62) 0%, rgba(10,8,4,0.28) 42%, rgba(0,0,0,0.05) 70%, rgba(0,0,0,0) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.22) 100%);
      z-index: -1;
    }

    .content {
      position: absolute;
      top: 50%;
      left: 7%;
      transform: translateY(-50%);
      color: #f6efe1;
      max-width: 560px;
    }

    /* Eyebrow — droben zlat uvodni napis */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: 'Libre Franklin', sans-serif;
      font-weight: 400;
      font-size: 0.74rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: rise 1s ease 0.1s forwards;
    }
    .eyebrow::before {
      content: "";
      width: 46px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
    }

    .content h1 {
      font-family: 'Newsreader', serif;
      font-weight: 600;
      font-size: clamp(4.4rem, 11vw, 9.2rem);
      line-height: 0.96;
      letter-spacing: 0.005em;
      color: #ffffff;
      /* črn glow okoli črk za večji poudarek */
      text-shadow:
        0 0 14px rgba(0,0,0,0.60),
        0 0 34px rgba(0,0,0,0.50),
        0 4px 44px rgba(0,0,0,0.55);
      margin-bottom: 2.6rem;
      opacity: 0;
      animation: rise 1.1s ease 0.25s forwards;
    }
    .content h1 .accent {
      display: block;
      font-style: italic;
      font-weight: 500;
      color: #ffffff;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1rem;
      opacity: 0;
      animation: rise 1.1s ease 0.45s forwards;
    }

    .btn {
      position: relative;
      display: inline-block;
      font-family: 'Libre Franklin', sans-serif;
      padding: 1.05rem 2.5rem;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: transform 0.35s cubic-bezier(.22,1,.36,1), box-shadow 0.35s ease, background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
      cursor: pointer;
    }

    /* Primarni — poln bel gumb */
    .btn-primary {
      background: #ffffff;
      color: #1a1a1a;
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px -8px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.6);
    }

    /* Sekundarni — prosojen z belo hairline obrobo */
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(3px);
    }
    .btn-secondary:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.95);
      color: #ffffff;
      background: rgba(255,255,255,0.14);
      box-shadow: 0 14px 34px -12px rgba(0,0,0,0.6);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .content { left: 6%; right: 6%; max-width: none; }
      .buttons { flex-direction: column; }
      .btn { text-align: center; }
      .eyebrow { letter-spacing: 0.32em; }
    }
  </style>
